{% extends "base.html" %}

{% block extra_title %} | Delete Message{% endblock %}

{% block content %}

<section class="py-5 bg-light">
    <div class="container py-lg-4">

        <div class="bg-white border shadow-sm p-4">

            <h1 class="h3 font-weight-bold mb-4">
                Delete Message
            </h1>

            <p class="text-muted">
                Are you sure you want to delete this message?
            </p>

            <div class="alert alert-warning">
                {{ message_obj.message }}
            </div>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'client_project_messages' message_obj.project.id %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>

    </div>
</section>

{% endblock %}
