{% extends "base.html" %}
{% load static %}

{% block extra_title %} | Payment Cancelled{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container py-lg-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="bg-white border shadow-sm p-4 p-lg-5 text-center">
                    <div class="mb-4">
                        <i class="fas fa-times-circle fa-3x text-danger"></i>
                    </div>

                    <p class="text-uppercase font-weight-bold text-secondary mb-2">Payment Cancelled</p>
                    <h1 class="font-weight-bold mb-3">Your payment was not completed</h1>
                    <p class="lead text-muted">
                        No charge was made. You can return to the payment page and try again when ready.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'pay_quote' %}" class="btn btn-dark btn-lg mr-2 mb-2">Try Again</a>
                        <a href="{% url 'contact' %}" class="btn btn-outline-dark btn-lg mb-2">Contact Us</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
