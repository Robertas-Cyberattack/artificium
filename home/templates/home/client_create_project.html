{% extends "base.html" %}

{% block extra_title %} | New Project{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container py-lg-4">

        <div class="mb-5">
            <p class="text-uppercase font-weight-bold text-secondary mb-2">
                Client Area
            </p>

            <h1 class="font-weight-bold">
                New Project Request
            </h1>

            <p class="lead text-muted mb-0">
                Submit a new project request for review and pricing.
            </p>
        </div>

        <div class="bg-white border shadow-sm p-4">
            <form method="post">
                {% csrf_token %}

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Project Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Project Description</label>
                    <textarea name="description" class="form-control" rows="5"></textarea>
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold">Additional Notes</label>
                    <textarea name="client_notes" class="form-control" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-dark">
                    Submit Project Request
                </button>

                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>
        </div>

    </div>
</section>
{% endblock %}
