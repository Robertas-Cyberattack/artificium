{% extends "base.html" %}

{% load i18n %}

{% block extra_title %} | Set Password{% endblock %}

{% block content %}

<section class="py-5 bg-light">
    <div class="container py-lg-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-6">

                <div class="bg-white shadow-sm border rounded p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <p class="text-uppercase text-muted font-weight-bold mb-2">
                            Account Security
                        </p>

                        <h1 class="mb-3">
                            {% trans "Set Password" %}
                        </h1>

                        <p class="text-muted mb-0">
                            Create a secure password for your account.
                        </p>

                    </div>

                    <form method="POST"
                          action="{% url 'account_set_password' %}"
                          class="password_set">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="text-center mt-4">
                            <input type="submit"
                                   name="action"
                                   value="{% trans 'Set Password' %}"
                                   class="btn btn-dark px-4">
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}
