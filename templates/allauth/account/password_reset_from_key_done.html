{% extends "base.html" %}

{% load i18n %}

{% block extra_title %} | Password Changed{% endblock %}

{% block content %}

<section class="py-5 bg-light">
    <div class="container py-lg-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-6">

                <div class="bg-white shadow-sm border rounded p-4 p-lg-5 text-center">

                    <p class="text-uppercase text-muted font-weight-bold mb-2">
                        Account Security
                    </p>

                    <h1 class="mb-3">
                        {% trans "Password Changed" %}
                    </h1>

                    <p class="text-muted mb-4">
                        {% trans "Your password has been successfully changed." %}
                    </p>

                    <a href="{% url 'account_login' %}"
                       class="btn btn-dark px-4">
                        Login
                    </a>

                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}
