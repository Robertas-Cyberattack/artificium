{% extends "base.html" %}

{% block extra_title %} | Delete Project{% endblock %}

{% block content %}

<section class="py-5 bg-light">
    <div class="container py-lg-4">

        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="bg-white border shadow-sm p-5 text-center">

                    <p class="text-uppercase font-weight-bold text-danger mb-2">
                        Warning
                    </p>

                    <h1 class="font-weight-bold mb-4">
                        Delete Project
                    </h1>

                    <p class="lead text-muted mb-4">
                        Are you sure you want to delete this project?
                    </p>

                    <h3 class="mb-4">
                        "{{ project.title }}"
                    </h3>

                    <form method="post">
                        {% csrf_token %}

                        <button type="submit" class="btn btn-danger">
                            Yes, Delete Project
                        </button>

                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </form>

                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
