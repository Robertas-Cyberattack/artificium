{% extends "base.html" %}

{% block extra_title %} | Edit Project{% endblock %}

{% block content %}

<section class="py-5 bg-light">
    <div class="container py-lg-4">

        <div class="mb-5">
            <p class="text-uppercase font-weight-bold text-secondary mb-2">
                Admin Area
            </p>

            <h1 class="font-weight-bold">
                Edit Project
            </h1>

            <p class="lead text-muted mb-0">
                Update project price, invoice, payment status and progress.
            </p>
        </div>

        <div class="bg-white border shadow-sm p-4">

            <form method="post">
                {% csrf_token %}

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Client</label>
                    <select name="client" class="form-control">
                        {% for client in clients %}
                            <option value="{{ client.id }}" {% if project.client.id == client.id %}selected{% endif %}>
                                {{ client.username }} - {{ client.email }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Project Title</label>
                    <input type="text" name="title" class="form-control" value="{{ project.title }}" required>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Description</label>
                    <textarea name="description" class="form-control" rows="5">{{ project.description }}</textarea>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Price (£)</label>
                    <input type="number" name="price" class="form-control" step="0.01" min="0" value="{{ project.price }}">
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Invoice Number</label>
                    <input type="text" name="invoice_number" class="form-control" value="{{ project.invoice_number }}">
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Payment Status</label>

                    <div class="form-check">
                        <input type="checkbox"
                               name="is_paid"
                               class="form-check-input"
                               id="is_paid"
                               {% if project.is_paid %}checked{% endif %}>

                        <label class="form-check-label" for="is_paid">
                            Paid
                        </label>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Status</label>
                    <select name="status" class="form-control">
                        {% for value, label in status_choices %}
                            <option value="{{ value }}" {% if project.status == value %}selected{% endif %}>
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Progress %</label>
                    <input type="number" name="progress" class="form-control" min="0" max="100" value="{{ project.progress }}">
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold">Admin Notes</label>
                    <textarea name="admin_notes" class="form-control" rows="5">{{ project.admin_notes }}</textarea>
                </div>

                <button type="submit" class="btn btn-dark">
                    Save Changes
                </button>

                <a href="{% url 'admin_project_detail' project.id %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>

    </div>
</section>

{% endblock %}
