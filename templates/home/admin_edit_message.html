{% extends "base.html" %}

{% block extra_title %} | Admin Edit Message{% endblock %}

{% block content %}

<section class="py-5 bg-light">
    <div class="container py-lg-4">

        <div class="bg-white border shadow-sm p-4">

            <h1 class="h4 mb-4">
                Edit Message
            </h1>

            <p class="text-muted">
                Project: {{ message_obj.project.title }}
            </p>

            <p class="text-muted">
                Sender: {{ message_obj.sender.username }}
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label class="font-weight-bold">
                        Message
                    </label>

                    <textarea name="message" class="form-control" rows="5" required>{{ message_obj.message }}</textarea>
                </div>

                <button type="submit" class="btn btn-dark">
                    Save Changes
                </button>

                <a href="{% url 'admin_project_messages' message_obj.project.id %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>

    </div>
</section>

{% endblock %}
